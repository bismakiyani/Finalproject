  # ─── Backend ────────────────────────────────
  backend:
    build: ./backend
    image: backend
    container_name: backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/fileforge
      - MAX_FILE_SIZE=52428800
      - UPLOAD_DIR=./uploads
      - ALLOWED_ORIGINS=http://65.1.95.241
    expose:
      - "5000"
    depends_on:
      - mongo
    networks:
      - app_network

  # ─── Frontend ───────────────────────────────
  frontend:
    build: ./frontend
    image: frontend
    container_name: frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api
      - NODE_ENV=production
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - app_network
